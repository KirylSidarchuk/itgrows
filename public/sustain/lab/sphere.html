<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio Sphere</title>
  <link rel="icon" href="/sustain/assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face {
      font-family: "Inter";
      src: url("/sustain/assets/fonts/inter-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      --bg: #0b0b0c;
      --text: #f2efe9;
      --muted: #9b978f;
      --line: rgba(255, 255, 255, 0.12);
      --gold: #d9b38c;
      --gold-ink: #1a1410;
    }

    * { box-sizing: border-box; }

    html { overflow-x: hidden; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(60% 50% at 70% 55%, rgba(217, 179, 140, 0.10), transparent 70%),
        var(--bg);
      overflow-x: hidden;
    }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1440px;
      margin: 0 auto;
      padding: 22px 48px;
    }

    .bar__logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
    }

    .bar__note {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(300px, 0.78fr) 1.22fr;
      align-items: center;
      gap: 24px;
      max-width: 1440px;
      min-height: calc(100vh - 70px);
      margin: 0 auto;
      padding: 0 48px 32px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::after {
      content: "";
      width: 40px;
      height: 1px;
      background: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 4.6vw, 64px);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.04;
    }

    h1 em {
      color: var(--gold);
      font-style: normal;
    }

    .lede {
      max-width: 40ch;
      margin: 22px 0 0;
      color: #c9c5bd;
      font-size: 16px;
      line-height: 1.6;
    }

    .now {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      min-height: 190px;
    }

    .now__count {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.14em;
      font-variant-numeric: tabular-nums;
    }

    .now__name {
      margin: 10px 0 0;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .now__tag {
      margin: 8px 0 0;
      color: var(--gold);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .now__headline {
      margin: 12px 0 0;
      color: #c9c5bd;
      font-size: 15px;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 26px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: var(--gold);
      color: var(--gold-ink);
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .round {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 17px;
      cursor: pointer;
    }

    .round:hover { border-color: var(--gold); }

    .hint {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    /* The sphere: tiles on a ball, turned as one. */
    .stage {
      position: relative;
      height: min(80vh, 760px);
      min-height: 420px;
      perspective: 1500px;
      cursor: grab;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    .stage.is-dragging { cursor: grabbing; }

    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 112%;
      height: 34%;
      border: 1px solid rgba(217, 179, 140, 0.4);
      border-radius: 50%;
      transform: translate(-50%, -38%) rotate(-7deg);
      pointer-events: none;
      box-shadow: 0 0 24px rgba(217, 179, 140, 0.18);
    }

    .glow {
      position: absolute;
      left: 50%;
      bottom: 4%;
      width: 60%;
      height: 40px;
      background: radial-gradient(50% 50% at 50% 50%, rgba(217, 179, 140, 0.35), transparent 70%);
      transform: translateX(-50%);
      filter: blur(8px);
      pointer-events: none;
    }

    .sphere {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--w);
      height: var(--h);
      margin: calc(var(--h) / -2) 0 0 calc(var(--w) / -2);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--rad, 16px);
      padding: 0;
      background: #161515;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: inherit;
      transform: rotateY(var(--lon)) rotateX(var(--lat)) translateZ(var(--r));
      backface-visibility: hidden;
      transition: border-color 0.25s ease, filter 0.25s ease;
      filter: brightness(0.62) saturate(0.85);
    }

    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      pointer-events: none;
    }

    .tile--project::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 10, 10, 0.95) 0, rgba(10, 10, 10, 0.9) 34%, rgba(10, 10, 10, 0.15) 58%, rgba(10, 10, 10, 0.05) 80%, rgba(10, 10, 10, 0.5) 100%);
    }

    /* Covers carry their own title: wide ones at the top, portrait ones at the bottom. Both are cut off. */
    .tile--project img {
      top: auto;
      bottom: 0;
      height: 122%;
    }

    .tile--portrait img {
      top: 0;
      bottom: auto;
      height: 124%;
    }

    .tile--project.is-front {
      border-color: rgba(217, 179, 140, 0.8);
      filter: none;
    }

    .tile--project.is-near { filter: brightness(0.85); }

    .tile__text {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 14px;
      z-index: 1;
    }

    .tile__num {
      color: rgba(255, 255, 255, 0.7);
      font-size: 11px;
      letter-spacing: 0.1em;
    }

    .tile__name {
      margin-top: 8px;
      font-size: calc(var(--w) * 0.12);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    .tile__tag {
      margin-top: 8px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .tile__go {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .tile--project.is-front .tile__go { opacity: 1; }

    /* The project in full. */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(5, 5, 5, 0.72);
      backdrop-filter: blur(6px);
    }

    .overlay[hidden] { display: none; }

    .card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: min(920px, 100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #121212;
    }

    .card img {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 320px;
      object-fit: cover;
      object-position: center top;
    }

    .card__body {
      position: relative;
      padding: 34px 32px;
    }

    .card__close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
    }

    .card__tag {
      margin: 0;
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .card__name {
      margin: 12px 0 0;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .card__headline {
      margin: 12px 0 0;
      font-size: 17px;
      line-height: 1.45;
    }

    .card__text {
      margin: 14px 0 0;
      color: #bdb9b1;
      font-size: 14px;
      line-height: 1.6;
    }

    .card__link[hidden] { display: none; }

    .card__link {
      display: inline-flex;
      margin-top: 24px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    @media (max-width: 900px) {
      .bar { padding: 18px 20px; }
      .page {
        grid-template-columns: 1fr;
        padding: 0 20px 28px;
      }
      .stage {
        order: -1;
        height: 62vh;
        min-height: 380px;
      }
      .now { margin-top: 26px; min-height: 0; }
      .card { grid-template-columns: 1fr; }
      .card img { min-height: 220px; max-height: 300px; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <span class="bar__logo">PRODUCT STUDIO</span>
    <span class="bar__note">Draft · portfolio sphere</span>
  </header>

  <main class="page">
    <section>
      <p class="eyebrow">Our portfolio</p>
      <h1>We build digital products<br><em>across industries.</em></h1>
      <p class="lede">From the first idea to an international launch: product, design, engineering and growth in one team.</p>

      <div class="now" aria-live="polite">
        <div class="now__count" id="now-count">01 / 13</div>
        <h2 class="now__name" id="now-name"></h2>
        <p class="now__tag" id="now-tag"></p>
        <p class="now__headline" id="now-headline"></p>
      </div>

      <div class="controls">
        <button class="btn" id="open" type="button">View project <span aria-hidden="true">↗</span></button>
        <button class="round" id="prev" type="button" aria-label="Previous project">←</button>
        <button class="round" id="next" type="button" aria-label="Next project">→</button>
      </div>
      <p class="hint">Drag the sphere to spin it. Click a project to open it.</p>
    </section>

    <div class="stage" id="stage">
      <div class="orbit" aria-hidden="true"></div>
      <div class="sphere" id="sphere"></div>
      <div class="glow" aria-hidden="true"></div>
    </div>
  </main>

  <div class="overlay" id="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-name">
      <img id="card-img" alt="">
      <div class="card__body">
        <button class="round card__close" id="close" type="button" aria-label="Close">×</button>
        <p class="card__tag" id="card-tag"></p>
        <h2 class="card__name" id="card-name"></h2>
        <p class="card__headline" id="card-headline"></p>
        <p class="card__text" id="card-text"></p>
        <a class="card__link" id="card-link" target="_blank" rel="noopener noreferrer" hidden>Open platform ↗</a>
      </div>
    </div>
  </div>

  <script>
    // A draft: the same projects as /sustain, set on a sphere. Decorative tiles use the projects' own screens.
    const A = "/sustain/assets/";
    const PROJECTS = [
      ["MagiScan", "AI · 3D · Mobile", "Making the physical world editable.", "MagiScan is an AI-powered 3D creation ecosystem that allows real-world objects to be transformed into digital 3D models using a smartphone.", "magiscan-cover.png?v=2", "https://magiscan.app/"],
      ["AVA", "MedTech · AI · 3D", "3D technology for aesthetic medicine.", "AVA applies 3D scanning and digital visualization technology to aesthetic medicine workflows.", "ava-cover.png?v=2", ""],
      ["FreightSizer", "Logistics · Spatial AI", "Turning spatial data into smarter logistics.", "FreightSizer is a spatial technology product designed around cargo measurement and logistics workflows.", "freightsizer-cover.png?v=2", ""],
      ["ORTHIO", "3D · Orthotics · Mobile", "Guided 3D foot scanning from a smartphone.", "ORTHIO is a mobile 3D scanning product designed around remote foot scanning and custom orthotic workflows.", "orthio-cover.png?v=2", "https://orthio.app/"],
      ["ARize", "AR · E-commerce", "Bringing physical products into digital commerce.", "ARize is an augmented-reality commerce product focused on interactive product visualization using 3D and AR.", "arize-cover.png?v=2", ""],
      ["Monixa", "FinTech · AI", "Investment intelligence, reimagined.", "Monixa is an AI-powered financial technology product combining market intelligence, portfolio tools and personalized information experiences across web and mobile.", "monixa-01.jpg", "https://monixa.ai/"],
      ["ItGrows", "AI · SaaS", "An AI content engine that learns your voice.", "ItGrows is an AI-powered SaaS platform designed to create, schedule and publish content across LinkedIn and X.", "itgrows-cover.png?v=2", "https://www.itgrows.ai/"],
      ["Oyper", "Computer Vision", "Turning visual content into searchable commerce.", "Oyper is an AI-powered visual search and recommendation product designed to recognize fashion products in images and video.", "oyper-cover.png?v=2", ""],
      ["PickAClass", "EdTech · Marketplace", "Making practical education easier to discover.", "PickAClass is a digital learning marketplace built around course discovery, purchasing, subscriptions and skills credentials.", "pickaclass-cover.png?v=2", "https://pickaclass.com/"],
      ["LUNI", "E-commerce · Beauty", "A curated digital home for Korean beauty.", "LUNI is a premium Korean beauty e-commerce experience built around curated products, clean presentation and a clear customer journey.", "luni-cover.png?v=2", "https://www.luni.care/"],
      ["LearnFlat", "AI · EdTech", "Building smarter learning experiences.", "An AI-powered learning platform focused on structured skill development and personalized learning experiences.", "learnflat-cover.png?v=2", ""],
      ["DeepMate", "AI · HRTech", "AI-assisted recruiting and interviewing.", "A recruiting technology product centered around candidate-specific questions and structured AI-assisted interview workflows.", "deepmate-cover.png?v=2", ""],
      ["AppsLift", "Mobile · ASO · Growth", "Helping mobile products get discovered.", "A mobile growth product focused on app-store visibility, search optimization and organic acquisition.", "appslift-cover.png?v=2", "https://ai.appslift.com/"]
    ].map(([name, tag, headline, text, img, url]) => ({ name, tag, headline, text, img: A + img, url, portrait: /^(ava|monixa|itgrows|oyper|luni)/.test(img) }));

    const SCREENS = ["magiscan-01.jpg?v=3", "ava-01.jpg", "arize-01.jpg", "luni-01.webp", "magiscan-02.jpg", "orthio-01.jpg", "monixa-02.png", "ava-02.jpg", "arize-02.jpg", "luni-02.webp", "magiscan-03.jpg", "monixa-01.jpg"].map((f) => A + f);

    const stage = document.getElementById("stage");
    const sphere = document.getElementById("sphere");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const TILT = -9;
    const step = 360 / PROJECTS.length;
    let spin = 0;
    let target = null;
    let velocity = reduce ? 0 : -0.05;
    let active = -1;
    let projectTiles = [];

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Rings of the ball: the projects on the equator, the screens above and below it.
    function build() {
      const k = Math.min(1, stage.clientWidth / (stage.clientWidth < 600 ? 640 : 860), stage.clientHeight / 760);
      const R = Math.round(372 * k);
      const rings = [
        { lat: 0, count: PROJECTS.length, w: 168, h: 228, project: true },
        { lat: 35, count: 11, w: 150, h: 112 },
        { lat: -35, count: 11, w: 150, h: 112 },
        { lat: 62, count: 6, w: 112, h: 80 },
        { lat: -62, count: 6, w: 112, h: 80 }
      ];
      let html = "";
      let screen = 0;
      rings.forEach((ring, r) => {
        for (let i = 0; i < ring.count; i++) {
          const lon = (360 / ring.count) * i + (r % 2 ? 360 / ring.count / 2 : 0);
          const style = `--lon:${lon}deg;--lat:${ring.lat}deg;--r:${R}px;--w:${Math.round(ring.w * k)}px;--h:${Math.round(ring.h * k)}px`;
          if (ring.project) {
            const p = PROJECTS[i];
            html += `<button class="tile tile--project${p.portrait ? " tile--portrait" : ""}" type="button" data-index="${i}" style="${style}" aria-label="${esc(p.name)}">
              <img src="${esc(p.img)}" alt="" draggable="false">
              <span class="tile__text">
                <span class="tile__num">${String(i + 1).padStart(2, "0")}</span>
                <span class="tile__name" style="display:block">${esc(p.name)}</span>
                <span class="tile__tag" style="display:block">${esc(p.tag)}</span>
              </span>
              <span class="tile__go" aria-hidden="true">↗</span>
            </button>`;
          } else {
            html += `<span class="tile" aria-hidden="true" style="${style};--rad:12px"><img src="${SCREENS[screen++ % SCREENS.length]}" alt="" draggable="false" loading="lazy"></span>`;
          }
        }
      });
      sphere.innerHTML = html;
      projectTiles = [...sphere.querySelectorAll(".tile--project")];
      active = -1;
      render();
    }

    const norm = (a) => ((a % 360) + 540) % 360 - 180;

    function render() {
      sphere.style.transform = `rotateX(${TILT}deg) rotateY(${spin}deg)`;
      let best = 0;
      let dist = Infinity;
      PROJECTS.forEach((_, i) => {
        const d = Math.abs(norm(spin + i * step));
        if (d < dist) { dist = d; best = i; }
      });
      if (best !== active) {
        active = best;
        projectTiles.forEach((t, i) => {
          const d = Math.abs(norm(spin + i * step));
          t.classList.toggle("is-front", i === best);
          t.classList.toggle("is-near", i !== best && d < step * 1.6);
        });
        const p = PROJECTS[best];
        document.getElementById("now-count").textContent = `${String(best + 1).padStart(2, "0")} / ${PROJECTS.length}`;
        document.getElementById("now-name").textContent = p.name;
        document.getElementById("now-tag").textContent = p.tag;
        document.getElementById("now-headline").textContent = p.headline;
      }
    }

    function goTo(index) {
      const want = -index * step;
      target = spin + norm(want - spin);
      velocity = 0;
    }

    let dragging = false;
    let moved = 0;
    let lastX = 0;
    let lastT = 0;
    let idleSince = 0;

    function tick(now) {
      if (target !== null) {
        const d = target - spin;
        spin += d * 0.12;
        if (Math.abs(d) < 0.05) { spin = target; target = null; idleSince = now; }
      } else if (!dragging) {
        spin += velocity;
        velocity *= 0.95;
        // After a pause it starts turning slowly again by itself.
        if (!reduce && Math.abs(velocity) < 0.05 && now - idleSince > 3500) velocity = -0.05;
      }
      render();
      requestAnimationFrame(tick);
    }

    stage.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      dragging = true;
      moved = 0;
      lastX = e.clientX;
      lastT = performance.now();
      target = null;
      velocity = 0;
    });

    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      moved += Math.abs(dx);
      if (moved > 4) stage.classList.add("is-dragging");
      const now = performance.now();
      spin += dx * 0.22;
      velocity = (dx * 0.22) / Math.max(1, (now - lastT) / 16);
      lastX = e.clientX;
      lastT = now;
    });

    window.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = false;
      stage.classList.remove("is-dragging");
      idleSince = performance.now();
      if (moved > 4) {
        // Lands on the nearest project once the throw slows down.
        setTimeout(() => { if (!dragging && target === null) goTo(active); }, 650);
      }
    });

    stage.addEventListener("click", (e) => {
      if (moved > 4) return;
      const tile = e.target.closest(".tile--project");
      if (!tile) return;
      const i = Number(tile.dataset.index);
      if (i === active && target === null) openCard(i);
      else goTo(i);
    });

    document.getElementById("prev").addEventListener("click", () => goTo((active - 1 + PROJECTS.length) % PROJECTS.length));
    document.getElementById("next").addEventListener("click", () => goTo((active + 1) % PROJECTS.length));
    document.getElementById("open").addEventListener("click", () => openCard(active));
    document.addEventListener("keydown", (e) => {
      if (!overlay.hidden) { if (e.key === "Escape") closeCard(); return; }
      if (e.key === "ArrowRight") goTo((active + 1) % PROJECTS.length);
      if (e.key === "ArrowLeft") goTo((active - 1 + PROJECTS.length) % PROJECTS.length);
    });

    const overlay = document.getElementById("overlay");
    function openCard(i) {
      const p = PROJECTS[i];
      document.getElementById("card-img").src = p.img;
      document.getElementById("card-tag").textContent = p.tag;
      document.getElementById("card-name").textContent = p.name;
      document.getElementById("card-headline").textContent = p.headline;
      document.getElementById("card-text").textContent = p.text;
      const link = document.getElementById("card-link");
      link.hidden = !p.url;
      if (p.url) link.href = p.url;
      else link.removeAttribute("href");
      overlay.hidden = false;
      document.getElementById("close").focus();
    }
    function closeCard() { overlay.hidden = true; }
    document.getElementById("close").addEventListener("click", closeCard);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeCard(); });

    let lastW = 0;
    window.addEventListener("resize", () => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; build(); } });
    lastW = window.innerWidth;
    build();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
